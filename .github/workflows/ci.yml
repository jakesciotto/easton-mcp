name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: version is semver and equals VERSION
        run: |
          node -e "const p=require('./package.json').version;const a=require('fs').readFileSync('src/app.ts','utf8').match(/VERSION = '([^']+)'/)[1];for(const v of [p,a]){if(!/^\d+\.\d+\.\d+$/.test(v)){console.error('version is not MAJOR.MINOR.PATCH, got '+v);process.exit(1)}}if(p!==a){console.error('version fields disagree',{p,a});process.exit(1)}console.log('version '+p)"
      - run: npm run lint
      - run: npm run typecheck
      - name: test, writing the oracle report coherence resolves claims from
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=.coherence/test-report.json
      - run: npx coherence verify --from-report .coherence/test-report.json
      - run: npx coherence mass --check
      - run: npx coherence claude --check
      - run: npm run build
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
